<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Rick and Morty Explorer</h1>
    </header>

    <main>
        <section class="filters-section">
            <form id="search-form" class="search-form">
                <input type="text" id="name-filter" name="name" placeholder="Buscar por nombre...">

                <select id="status-filter" name="status" aria-label="Filtro de estado">
                    <option value="">Todos los estados</option>
                    <option value="alive">Vivo</option>
                    <option value="dead">Muerto</option>
                    <option value="unknown">Desconocido</option>
                </select>

                <input type="text" id="species-filter" name="species" placeholder="Especie...">

                <select id="gender-filter" name="gender" aria-label="Filtro de género">
                    <option value="">Todos los géneros</option>
                    <option value="female">Femenino</option>
                    <option value="male">Masculino</option>
                    <option value="genderless">Sin género</option>
                    <option value="unknown">Desconocido</option>
                </select>
                
                <button type="submit">Buscar</button>
                <button type="button" id="clear-btn">Limpiar</button>
            </form>
        </section>

        <section class="characters-section">
            <div id="characters-container" class="characters-container">
            </div>
            <div class="pagination-controls">
                <button id="prev-btn" class="pagination-btn" disabled>Anterior</button>
                <span id="page-info" class="page-info">Página 1</span>
                <button id="next-btn" class="pagination-btn">Siguiente</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Rick and Morty Explorer &copy; 2026</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
