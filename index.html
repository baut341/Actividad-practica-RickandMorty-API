<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Rick and Morty Explorer</h1>
    </header>

    <main>
        <section class="filters-section">
            <form id="search-form" class="search-form">
                <input type="text" id="name-filter" name="name" placeholder="Search by name...">
                
                <select id="status-filter" name="status" aria-label="Status filter">
                    <option value="">All Statuses</option>
                    <option value="alive">Alive</option>
                    <option value="dead">Dead</option>
                    <option value="unknown">Unknown</option>
                </select>

                <input type="text" id="species-filter" name="species" placeholder="Species...">

                <select id="gender-filter" name="gender" aria-label="Gender filter">
                    <option value="">All Genders</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="genderless">Genderless</option>
                    <option value="unknown">Unknown</option>
                </select>
                
                <button type="submit">Buscar</button>
                <button type="button" id="clear-btn">Limpiar</button>
            </form>
        </section>

        <section class="characters-section">
            <div id="characters-container" class="characters-container">
            </div>
            <div class="pagination-controls">
                <button id="prev-btn" class="pagination-btn" disabled>Anterior</button>
                <span id="page-info" class="page-info">Página 1</span>
                <button id="next-btn" class="pagination-btn">Siguiente</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Rick and Morty Explorer &copy; 2026</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
